[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nth-dao"
version = "0.10.0b1"
description = "AI-native Web3 DAO layer for humans and agents"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AlexNthLab" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "agent", "multi-agent", "dao", "web3", "ai", "claude", "hermes",
    "blackboard", "mission", "evolution", "identity", "a2a",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    # License classifier removed; modern SPDX `license` field replaces it (PEP 639)
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Zero third-party deps for core functionality.
# All NTH DAO core functionality uses only Python stdlib.
dependencies = []

[project.optional-dependencies]
# Optional extensions:
dev = ["pytest>=7.0", "ruff>=0.1.0", "mypy>=1.0"]
contracts = ["pydantic>=2.0"]    # stricter EvoLoop contract validation
retries = ["tenacity>=8.0"]      # better retry primitives in generated skills
crypto = ["pynacl>=1.5"]         # optional Ed25519 agent identity/signing
lan = ["zeroconf>=0.131"]        # optional mDNS/Bonjour LAN discovery backend
ux = ["qrcode[pil]>=7.4"]        # optional QR code rendering for invitations

# Backend-specific (only install what you use):
anthropic = ["anthropic>=0.40.0"]
claude = [
    "anthropic>=0.40.0",
    "pywinpty>=3.0.5; platform_system == 'Windows'",
]
claude-cli = ["pywinpty>=3.0.5; platform_system == 'Windows'"]
openai = ["openai>=1.0.0"]
google = ["google-generativeai>=0.3.0"]
hermes = []  # via subprocess; install hermes-agent separately
web = ["fastapi>=0.100", "uvicorn>=0.20"]  # nth_dao.web local console

[project.urls]
Homepage = "https://github.com/AlexNthLab/nth-dao"
Documentation = "https://github.com/AlexNthLab/nth-dao#readme"
Issues = "https://github.com/AlexNthLab/nth-dao/issues"
Changelog = "https://github.com/AlexNthLab/nth-dao/blob/main/CHANGELOG.md"

[project.scripts]
nth-web = "nth_dao.web:main"
nth-status = "nth_dao.cli.status:main"
nth-metrics = "nth_dao.cli.metrics:main"

[tool.setuptools]
packages = [
    "nth_dao",
    "nth_dao.a2a",
    "nth_dao.cli",
    "nth_dao.conformance",
    "nth_dao.discovery",
    "nth_dao.mandate",
    "nth_dao.orchestration",
    "nth_dao.util",
    "nth_dao.web",
    "nth_dao.web.static",
    "nth_dao.web.static.assets",
    "team_layer",
    "team_layer.backends",
    "team_layer.blackboard",
    "team_layer.compression",
    "team_layer.evolution",
    "team_layer.git_sync",
    "team_layer.memory_providers",
]

# Optional package data: include INTEGRATION_GUIDE inside nth_dao/
[tool.setuptools.package-data]
"nth_dao" = ["INTEGRATION_GUIDE.md", "*.toml"]
"nth_dao.conformance" = ["vectors.json"]
"nth_dao.web" = ["static/index.html", "static/assets/*"]

[tool.setuptools.exclude-package-data]
"*" = [".gitignore", ".gitkeep", "__pycache__/*", "*.pyc"]
