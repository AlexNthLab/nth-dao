name: Publish to PyPI

# Tag pushes publish to PyPI. Manual runs may target TestPyPI or PyPI.
# OIDC trusted publishing is used; no repository API token is required.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      target:
        description: "Package index"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/dev.lock.txt
            requirements/web.lock.txt
            requirements/crypto.lock.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked test dependencies and build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements/dev.lock.txt \
            -r requirements/web.lock.txt \
            -r requirements/crypto.lock.txt
          python -m pip install build==1.3.0 twine==6.2.0
          python -m pip install --no-deps -e .

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify clean tracked tree and privacy policy
        run: python tools/release_gate.py

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.loads(open('pyproject.toml','rb').read().decode())['project']['version'])")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match pyproject version $PKG_VERSION"
            exit 1
          fi
          echo "Tag v$TAG_VERSION matches pyproject version $PKG_VERSION"

      - name: Run Python test suite
        run: python -m pytest -q

      - name: Run frontend test suite
        working-directory: frontend
        run: npm run test:raw -- --fileParallelism=false

      - name: Build frontend production assets
        working-directory: frontend
        run: npm run build:raw

      - name: Verify frontend build is committed and privacy-safe
        run: python tools/release_gate.py

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: |
          python -m twine check dist/*
          python tools/release_gate.py --dist dist/*

      - name: Smoke-test wheel in a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/nth-dao-smoke"
          "$RUNNER_TEMP/nth-dao-smoke/bin/python" -m pip install \
            -r requirements/web.lock.txt \
            -r requirements/crypto.lock.txt
          "$RUNNER_TEMP/nth-dao-smoke/bin/python" -m pip install \
            --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/nth-dao-smoke/bin/python" - <<'PY'
          import importlib

          modules = (
              "nth_dao",
              "nth_dao.audit",
              "nth_dao.authz",
              "nth_dao.commerce",
              "nth_dao.conversation",
              "nth_dao.dispute",
              "nth_dao.governance",
              "nth_dao.integrations",
              "nth_dao.market",
              "nth_dao.runtime",
              "nth_dao.social",
              "nth_dao.spine",
              "nth_dao.web",
              "team_layer",
              "team_layer.backends",
          )
          for module in modules:
              importlib.import_module(module)
          print(f"Imported {len(modules)} release modules from the wheel.")
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish-testpypi:
    needs: build
    # TestPyPI is only available from a deliberate manual run.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/nth-dao/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    # PyPI requires a matching tag or a deliberate manual run.
    if: |
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nth-dao/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
